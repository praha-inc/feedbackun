name: Setup workspace
description: Setup workspace

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version-file: .node-version
        cache: 'pnpm'

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile --prefer-offline

    - name: Copy .wrangler.toml
      shell: bash
      run: |
        cp ./apps/slack/wrangler.example.json ./apps/slack/wrangler.json
        cp ./apps/web/wrangler.example.json ./apps/web/wrangler.json
        cp ./packages/database/wrangler.example.json ./packages/database/wrangler.json
